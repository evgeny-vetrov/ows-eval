# The wait for the shipment is renamed and the result gains the version: every running
# fabula can move in flight, a fabula waiting for the shipment by the suggested mapping.
document:
  dsl: '1.0.3'
  namespace: demo
  name: order
  version: '1.1.0'
  title: Order fulfilment
do:
  - accept: {set: {}, export: {as: '${ {order: $input.order} }'}}
  - reserve: {call: 'inventory.reserve:1@demo', with: {order: '${ $context.order }'}}
  - charge: {call: 'payment.charge:1@demo', with: {order: '${ $context.order }'}}
  - awaitShipment:
      listen:
        to:
          one:
            with: {type: shop.order.shipped}
            correlate:
              order: {from: '${ .data.order }', expect: '${ $context.order }'}
      timeout: {after: P2D}
  - announce:
      emit:
        event:
          with:
            type: shop.order.completed
            data: {order: '${ $context.order }'}
  - finish: {set: {order: '${ $context.order }', state: done, version: '1.1'}}
